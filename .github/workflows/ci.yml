name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual "Run workflow" button — used for the iOS/TestFlight job

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Logic suite
        run: npm test
      - name: Difficulty sweep
        run: npx tsx test/tune.ts
      - name: Build the single-file demo
        run: npm run demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  # Publishes the playable demo so it can be opened on a phone without Xcode.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Real native build, on GitHub's macOS runner — the only place in this
  # pipeline a Mac exists. Manual signing throughout: the certificate and
  # provisioning profile come from secrets, already created, so nothing has
  # to be generated on a machine that gets wiped after the job.
  #
  # Automatic signing does NOT work here. It resolves to an "iOS App
  # Development" profile, which requires registered device UDIDs a runner
  # will never have; and any tool that creates a certificate on the runner
  # loses the private key when the runner dies, so it creates a fresh one
  # every run until Apple's 3-certificate limit is hit.
  #
  # Manual only. Trigger from Actions -> "CI" -> "Run workflow".
  ios-testflight:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.ASC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.ASC_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.ASC_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for v in CERT_P12 CERT_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret ASC_$v is missing or empty"; exit 1; fi
          done
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          # A dedicated keychain, unlocked for the life of the job. The
          # password protects nothing beyond this runner.
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm /tmp/cert.p12
          echo "Installed identities:"
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        id: profile
        env:
          PROFILE_BASE64: ${{ secrets.ASC_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Secret ASC_PROFILE is missing or empty"; exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          # Read the profile's own name rather than hardcoding it — a typo in
          # a hardcoded PROVISIONING_PROFILE_SPECIFIER is a confusing failure.
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist)
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Profile: $NAME ($UUID) for $APPID"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export and upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.ASC_BUNDLE_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$KEY_CONTENT" | base64 --decode > ~/private_keys/AuthKey_$KEY_ID.p8
          grep -q "PRIVATE KEY" ~/private_keys/AuthKey_$KEY_ID.p8 || {
            echo "::error::ASC_KEY_CONTENT did not decode to a .p8 private key"; exit 1; }
          # Unquoted heredoc so the variables below get substituted.
          cat > /tmp/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath build \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
