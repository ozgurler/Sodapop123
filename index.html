<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#a82722" />
    <title>Soda Pop 1, 2, 3 — Thumb War Version</title>
    <style>
      /* Fonts are bundled, not fetched — the game has to work with no network. */
      @font-face {
        font-family: 'Baloo 2';
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
        src: url('./fonts/Baloo2-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Baloo 2';
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
        src: url('./fonts/Baloo2-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 400 900;
        font-display: block;
        src: url('./fonts/Nunito-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 400 900;
        font-display: block;
        src: url('./fonts/Nunito-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #221d2b;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Preloads the two families so the first canvas frame isn't drawn in a
         fallback face. Off-screen, never read by anyone. */
      #font-warm {
        position: fixed;
        left: -9999px;
        top: 0;
        font-size: 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="font-warm" aria-hidden="true">
      <span style="font: 800 8px 'Baloo 2'">1</span><span style="font: 800 8px Nunito">1</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
